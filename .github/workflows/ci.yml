name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + tests
    runs-on: ubuntu-latest

    env:
      # The ignored-builds quirk (ERR_PNPM_IGNORED_BUILDS) also makes pnpm's
      # pre-run deps-status check fail, which would make `pnpm exec <cmd>` exit 1
      # regardless of whether the command itself succeeds. Disabling that check
      # lets `pnpm exec tsc/vitest/eslint` report the real result. Skipped native
      # builds (bcrypt/sharp) do not affect typecheck or the pure unit tests.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Known quirk: pnpm install exits 1 with ERR_PNPM_IGNORED_BUILDS even
      # though onlyBuiltDependencies is set. Skipped bcrypt/sharp native builds
      # do not affect typecheck or the pure unit tests. The later steps fail
      # loudly if deps are genuinely missing, so this only swallows the benign
      # ignored-builds exit code.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || true

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Lint
        continue-on-error: true
        run: pnpm exec eslint
